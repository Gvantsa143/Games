<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=n , initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<form action="">
        <label for="">Username</label>
        <input type="text" id="username" placeholder="Username..." required minlength="3" max="15">

        <label for="country">Country</label>
        <select name="country" id="country">
            <option value="geo">Georgia</option>
            <option value="usa">USA</option>
            <option value="ger">Germany</option>
        </select>
        <!-- <textarea name="" id=""></textarea> -->

    </form>

    <form action="">

        <div>
            <label for="text">Name</label>
            <input type="text" required minlength="3" max="30">
        </div>
         <div>
            <label for="email">Email</label>
            <input type="email" id="email">
            <!-- <p class="incorrect" id="incorrect"> Type correct email address, for example name@mail.com</p> -->
        </div>
         <div>
            <label for="tel">Phone Number</label>
            <input type="tel" id="tel">
        </div>
         <div>
            <label for="birthday">Birth Date</label>
            <input type="date" min="1950-01-01" max="2007-01-01">
        </div>
        <!-- <div>
            <label for="">checkbox</label>
            <input type="checkbox" id="checkbox">
        </div> -->
        <div class="gender">
             <div>
                <label for="">Male</label>
                <input type="radio" name="gender">
             </div>
             <div>
                <label for="">Female</label>
                <input type="radio" name="gender">
             </div>
             <div>
                <label for="">Prefer Not to Say</label>
                <input type="radio" name="gender">
             </div>
            
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" required pattern="5[0-9]{8}">
        </div>
        <div>
            <label for="">Slider</label>
            <input type="range" id="range">
        </div>
        <div>
            <label for="">file</label>
            <input type="file" id="file">
        </div>

        <button type="submit">Submit</button>
    </form>


</body>
</html>
